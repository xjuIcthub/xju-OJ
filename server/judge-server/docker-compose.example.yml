services:
  judge-server:
    build:
      context: ../
      dockerfile: Dockerfile
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - KILL
    pids_limit: 512
    tmpfs:
      - /tmp
      - /judger/run
      - /judger/spj
    volumes:
      - $PWD/tests/test_case:/test_case:ro
      - $PWD/log:/log
    environment:
      TOKEN_FILE: /run/secrets/judge_server_token
      BACKEND_URL: http://backend-api:8000/api/judge_server_heartbeat/
      SERVICE_URL: http://judge-server:8080
    secrets:
      - judge_server_token
    expose:
      - "8080"

secrets:
  judge_server_token:
    file: ${JUDGE_SERVER_TOKEN_FILE:?JUDGE_SERVER_TOKEN_FILE is required}
