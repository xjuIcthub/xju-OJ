server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;

    sendfile on;
    tcp_nopush on;
    etag on;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/javascript application/json application/manifest+json application/wasm application/xml image/svg+xml text/css text/javascript text/plain text/xml;

    location = /admin {
        return 301 /admin/;
    }

    location = /api {
        proxy_pass http://backend-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRFToken $http_x_csrftoken;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location ^~ /api/ {
        proxy_pass http://backend-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRFToken $http_x_csrftoken;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location ^~ /public/avatar/ {
        alias /data/public/avatar/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    location ^~ /public/ {
        alias /data/public/;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* "^/static/.*-[0-9A-Za-z_-]{8,}\\.(css|js|woff2?|eot|ttf|otf|svg|png|jpg|jpeg|gif|webp|avif|ico)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /static/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /admin/index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
