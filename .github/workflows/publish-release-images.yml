name: Publish immutable release images

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Accepted application source commit
        required: true
        default: 013aee93b669c552e7261556a8d162429d664b4e
      release_id:
        description: Immutable release identifier
        required: true
        default: phase3-rc-013aee9

concurrency:
  group: publish-${{ inputs.release_id }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: xjuicthub
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e

jobs:
  mirror-data-images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres
            source: postgres:18.6-bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
            destination: xju-oj-postgres
          - name: redis
            source: redis:8.2.8-bookworm@sha256:2f7462b9e93e0a7ae2edf3a0a0babc8a4d29f8bfc50849b906b7caaef925edc1
            destination: xju-oj-redis
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror the pinned amd64 image
        id: mirror
        env:
          SOURCE: ${{ matrix.source }}
          DESTINATION: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.destination }}:${{ inputs.release_id }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$SOURCE"
          image_id=$(docker image inspect --format '{{.Id}}' "$SOURCE")
          docker tag "$SOURCE" "$DESTINATION"
          docker push "$DESTINATION" | tee push.log
          digest=$(awk '/digest: sha256:/{print $2}' push.log | tail -1)
          test -n "$digest"
          printf 'reference=%s@%s\n' "${DESTINATION%:*}" "$digest" >> "$GITHUB_OUTPUT"
          printf 'image_id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"

      - name: Scan critical vulnerabilities
        env:
          IMAGE: ${{ steps.mirror.outputs.reference }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            "$TRIVY_IMAGE" image \
            --scanners vuln --severity CRITICAL \
            --exit-code 1 --format json --output /tmp/trivy.json "$IMAGE"
          docker run --rm \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            "$TRIVY_IMAGE" image \
            --scanners vuln --severity CRITICAL \
            --exit-code 0 --format table "$IMAGE"

      - name: Record image metadata
        env:
          NAME: ${{ matrix.name }}
          SOURCE: ${{ matrix.source }}
          REFERENCE: ${{ steps.mirror.outputs.reference }}
          IMAGE_ID: ${{ steps.mirror.outputs.image_id }}
        run: |
          jq -n \
            --arg name "$NAME" --arg source "$SOURCE" \
            --arg reference "$REFERENCE" --arg image_id "$IMAGE_ID" \
            '{name:$name, source:$source, reference:$reference, image_id:$image_id, platform:"linux/amd64", critical_vulnerabilities:"none-fixed"}' \
            > "metadata-$NAME.json"

      - name: Upload image metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata-${{ matrix.name }}
          path: metadata-${{ matrix.name }}.json
          if-no-files-found: error

  build-application-images:
    needs: mirror-data-images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            target: frontend-runtime
            destination: xju-oj-frontend
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            target: backend-runtime
            destination: xju-oj-backend
          - name: judge-toolchain
            context: .
            file: ./server/Dockerfile
            target: judge-toolchain
            destination: xju-oj-judge-toolchain
          - name: server
            context: .
            file: ./server/Dockerfile
            target: judge-server
            destination: xju-oj-server
    steps:
      - name: Check out accepted source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Set build timestamp
        id: timestamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.destination }}:${{ inputs.release_id }}
          build-args: |
            GIT_COMMIT=${{ inputs.source_sha }}
            VCS_REF=${{ inputs.source_sha }}
            BUILD_VERSION=${{ inputs.release_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.release_id }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.value }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan critical vulnerabilities
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.destination }}@${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            "$TRIVY_IMAGE" image \
            --scanners vuln --severity CRITICAL \
            --exit-code 1 --format json --output /tmp/trivy.json "$IMAGE"
          docker run --rm \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            "$TRIVY_IMAGE" image \
            --scanners vuln --severity CRITICAL \
            --exit-code 0 --format table "$IMAGE"

      - name: Record image metadata
        env:
          NAME: ${{ matrix.name }}
          REFERENCE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.destination }}@${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          jq -n \
            --arg name "$NAME" --arg reference "$REFERENCE" \
            --arg source_sha "$SOURCE_SHA" --argjson build "$BUILD_METADATA" \
            '{name:$name, source_sha:$source_sha, reference:$reference, platform:"linux/amd64", sbom:true, provenance:"mode=max", critical_vulnerabilities:"none-fixed", build:$build}' \
            > "metadata-$NAME.json"

      - name: Upload image metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata-${{ matrix.name }}
          path: metadata-${{ matrix.name }}.json
          if-no-files-found: error

  publish-release-manifest:
    needs:
      - mirror-data-images
      - build-application-images
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download metadata
        uses: actions/download-artifact@v4
        with:
          pattern: release-metadata-*
          path: metadata
          merge-multiple: true

      - name: Assemble release manifest
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          test "$(find metadata -name 'metadata-*.json' | wc -l)" -eq 6
          jq -s \
            --arg release_id "$RELEASE_ID" --arg source_sha "$SOURCE_SHA" \
            '{release_id:$release_id, source_sha:$source_sha, generated_at:(now|todate), images:(map({key:.name,value:.})|from_entries)}' \
            metadata/metadata-*.json > release-manifest.json
          sha256sum release-manifest.json > release-manifest.sha256

      - name: Publish durable manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          tag="images-${RELEASE_ID}"
          gh release create "$tag" release-manifest.json release-manifest.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease \
            --title "Immutable images ${RELEASE_ID}" \
            --notes "Immutable linux/amd64 release images with SBOM, maximum BuildKit provenance, and fixed-Critical vulnerability gates."
