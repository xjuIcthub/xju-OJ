[project]
name = "xju-oj-backend"
version = "0.0.0"
description = "xju-OJ backend runtime"
requires-python = ">=3.10,<3.11"
dependencies = [
  "django-cas-ng==5.1.1",
  "django-dbconn-retry==0.3.1",
  "django-dramatiq==0.15.0",
  "django-redis==7.0.0",
  "redis==7.4.1",
  "Django==5.2.17",
  "djangorestframework==3.18.0",
  "dramatiq[redis]==2.2.0",
  "entrypoints==0.4",
  "Envelopes==0.4",
  "gunicorn==21.2.0",
  "jsonfield==3.2.0",
  "otpauth==1.0.1",
  "pillow==10.2.0",
  "psycopg[c]==3.3.4",
  "python-dateutil==2.8.2",
  "pytz==2026.3.post1",
  "qrcode==7.4.2",
  "sentry-sdk[django]==2.68.0",
  "XlsxWriter==3.1.9",
  "authlib==1.6.5",
  "requests==2.34.2",
]

[dependency-groups]
test = [
  "coverage==6.5.0"
]
lint = [
  "flake8==7.0.0",
  "flake8-coding==1.3.2",
  "flake8-quotes==3.3.2"
]
dev = [
  { include-group = "test" },
  { include-group = "lint" }
]

[tool.uv]
package = false
